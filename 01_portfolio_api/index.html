<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio API UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --danger: #f43f5e;
            --danger-hover: #e11d48;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.15), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.15), transparent 25%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-weight: 800;
            font-size: 3rem;
            margin-bottom: 2rem;
            background: linear-gradient(to right, #38bdf8, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 768px) {
            .container {
                grid-template-columns: 350px 1fr;
            }
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* FORM BÖLÜMÜ */
        .form-section h2 {
            margin-bottom: 1rem;
            font-weight: 600;
            font-size: 1.5rem;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .input-group input, .input-group textarea {
            width: 100%;
            padding: 0.8rem;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus, .input-group textarea:focus {
            border-color: var(--primary);
        }

        .input-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            width: 100%;
            padding: 0.8rem;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: #000;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        /* KARTLAR (PROJELER) */
        .projects-section {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            align-content: start;
        }

        .project-card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(56, 189, 248, 0.2);
            border-color: rgba(56, 189, 248, 0.3);
        }

        .project-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--primary);
        }

        .project-desc {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            flex-grow: 1;
        }

        .project-tech {
            font-size: 0.8rem;
            background: rgba(168, 85, 247, 0.2);
            color: #d8b4fe;
            padding: 0.3rem 0.6rem;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 1rem;
        }

        .card-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-small {
            padding: 0.5rem;
            font-size: 0.85rem;
            flex: 1;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-edit {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }

        .btn-edit:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-delete {
            background: rgba(244, 63, 94, 0.2);
            color: var(--danger);
        }

        .btn-delete:hover {
            background: var(--danger);
            color: white;
        }
        
        .loading-state {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            padding: 2rem;
        }
    </style>
</head>
<body>

    <h1>Portfolio API Explorer</h1>

    <div class="container">
        <!-- FORM -->
        <aside class="glass-panel form-section">
            <h2 id="formTitle">Yeni Proje Ekle</h2>
            <form id="projectForm">
                <input type="hidden" id="projectId">
                <div class="input-group">
                    <label>Proje Başlığı</label>
                    <input type="text" id="title" required placeholder="Örn: E-Ticaret API">
                </div>
                <div class="input-group">
                    <label>Açıklama</label>
                    <textarea id="description" required placeholder="Projenin detayları..."></textarea>
                </div>
                <div class="input-group">
                    <label>Kullanılan Teknolojiler</label>
                    <input type="text" id="technologies" required placeholder="Örn: FastAPI, Docker">
                </div>
                <button type="submit" class="btn btn-primary" id="submitBtn">Kaydet</button>
                <button type="button" class="btn btn-small btn-edit" id="cancelBtn" style="display:none; margin-top:0.5rem;">İptal</button>
            </form>
        </aside>

        <!-- LİSTE -->
        <main class="projects-section" id="projectsContainer">
            <div class="loading-state">Projeler yükleniyor...</div>
        </main>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:8000';
        const form = document.getElementById('projectForm');
        const container = document.getElementById('projectsContainer');
        const formTitle = document.getElementById('formTitle');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');

        // Projeleri Getir (READ)
        async function fetchProjects() {
            try {
                const res = await fetch(`${API_URL}/projects`);
                if (!res.ok) throw new Error('API Bağlantı Hatası');
                const data = await res.json();
                renderProjects(data);
            } catch (error) {
                container.innerHTML = `<div class="loading-state">Bağlantı hatası: Sunucunun (uvicorn) çalıştığından emin olun.</div>`;
            }
        }

        // Ekrana Çizdir
        function renderProjects(projects) {
            if (projects.length === 0) {
                container.innerHTML = `<div class="loading-state">Henüz eklenmiş proje yok. Sol taraftan ilk projeni ekle!</div>`;
                return;
            }

            container.innerHTML = projects.map(p => `
                <div class="glass-panel project-card">
                    <div>
                        <div class="project-title">${p.title}</div>
                        <div class="project-tech">${p.technologies}</div>
                        <div class="project-desc">${p.description}</div>
                    </div>
                    <div class="card-actions">
                        <button class="btn-small btn-edit" onclick="editProject(${p.id}, '${p.title.replace(/'/g, "\\'")}', '${p.description.replace(/'/g, "\\'")}', '${p.technologies.replace(/'/g, "\\'")}')">Düzenle</button>
                        <button class="btn-small btn-delete" onclick="deleteProject(${p.id})">Sil</button>
                    </div>
                </div>
            `).join('');
        }

        // Kaydet / Güncelle (CREATE / UPDATE)
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const id = document.getElementById('projectId').value;
            const payload = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                technologies: document.getElementById('technologies').value,
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/projects/${id}` : `${API_URL}/projects`;

            try {
                await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                resetForm();
                fetchProjects();
            } catch (error) {
                alert("İşlem sırasında hata oluştu!");
            }
        });

        // Sil (DELETE)
        async function deleteProject(id) {
            if(!confirm('Bu projeyi silmek istediğine emin misin?')) return;
            
            try {
                await fetch(`${API_URL}/projects/${id}`, { method: 'DELETE' });
                fetchProjects();
            } catch (error) {
                alert("Silme sırasında hata oluştu!");
            }
        }

        // Düzenleme Moduna Geç
        function editProject(id, title, desc, tech) {
            document.getElementById('projectId').value = id;
            document.getElementById('title').value = title;
            document.getElementById('description').value = desc;
            document.getElementById('technologies').value = tech;
            
            formTitle.textContent = 'Projeyi Düzenle';
            submitBtn.textContent = 'Güncelle';
            cancelBtn.style.display = 'block';
        }

        // Formu Sıfırla
        function resetForm() {
            form.reset();
            document.getElementById('projectId').value = '';
            formTitle.textContent = 'Yeni Proje Ekle';
            submitBtn.textContent = 'Kaydet';
            cancelBtn.style.display = 'none';
        }

        cancelBtn.addEventListener('click', resetForm);

        // Başlangıçta çalıştır
        fetchProjects();
    </script>
</body>
</html>
